  <header>
    <h1>Klicker-Spiel</h1>
  </header>

  <main>
  <div class="game-wrap">
    <div class="hud">
      <span id="points">Punkte: 0</span>
      <span id="pps">Pro Sekunde: 0</span>
    </div>

    <button id="clickBtn" class="restart-btn" type="button">+1 klicken</button>

    <p class="hint">
      Kaufe Upgrades: Sie geben dir Punkte pro Sekunde (automatisch).
    </p>

    <div class="shop">
      <button id="buyAuto" type="button">Auto-Klicker kaufen (Kosten: <span id="autoCost">10</span>)</button>
      <button id="buyMulti" type="button">Mehr Klick kaufen (Kosten: <span id="multiCost">25</span>)</button>
    </div>

    <p class="hint" id="owned">
      Auto-Klicker: 0 • Klick-Stärke: 1
    </p>
  </div>
</main>
